{% extends 'base.html' %}

{% block content %}
  <section class="card narrow">
    <p class="eyebrow">DEVICE AUTHENTICATION</p>

    <h1>Login to modem</h1>

    <p>
      Enter your modem credentials. Your password is used for this login only.
    </p>

    <form method="post" data-pending="Connecting…">
      {% csrf_token %}

      {{ form.as_p }}

      <button>Login to Modem</button>
    </form>

    <a class="text-link" href="{% url 'modem:dashboard' %}">
      Back to dashboard
    </a>
  </section>
{% endblock %}
