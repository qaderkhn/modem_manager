name: Sync Dependabot uv lock
# Dependabot runs a newer uv than this repo pins and does not regenerate
# requirements.txt. Rewrite both files with the pinned uv, then re-run Checks
# (pushes made with GITHUB_TOKEN do not trigger workflows on their own).
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  sync:
    if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/uv/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv lock
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt
      - name: Commit and re-run Checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- uv.lock requirements.txt; then
            echo "Already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          git commit -m "Regenerate uv.lock and requirements.txt with uv 0.12.10"
          git push
          gh workflow run checks.yml --ref "$GITHUB_HEAD_REF"
