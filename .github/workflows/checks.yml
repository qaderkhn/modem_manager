name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py test --settings=config.test_settings
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - name: Check pip export matches lockfile
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt
